# Configuración para entorno de desarrollo con MySQL
# NOTA: Estas variables pueden ser sobrescritas por variables de entorno del sistema

# URL: Se usa 'mercalist_db' por defecto si la variable DB_NAME no está definida
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:mercalist_db}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Credenciales: Se usa 'root' y password vacío por defecto
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
