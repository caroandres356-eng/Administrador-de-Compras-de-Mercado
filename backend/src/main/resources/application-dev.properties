# Perfil de desarrollo local
# Todas las variables tienen defaults; sobreescribí con .env o env vars del sistema.
# Para levantar MariaDB en Docker: docker compose -f docker-compose.dev.yml up -d

spring.datasource.url=jdbc:mariadb://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:mercalist_db}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:Pipesofi2006}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
