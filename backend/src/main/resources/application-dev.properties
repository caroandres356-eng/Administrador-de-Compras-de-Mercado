# Configuración para entorno de desarrollo con MySQL
# NOTA: Estas variables pueden ser sobrescritas por variables de entorno del sistema

# URL: Se usa 'mercalist_db' por defecto si la variable DB_NAME no está definida
spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/${DB_NAME:mercalist_db}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Credenciales: Se usa 'root' y 'Pipesofi2006' por defecto
spring.datasource.username=${DB_USER:root}
spring.datasource.password=Pipesofi2006

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
